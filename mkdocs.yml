site_name: DbDash Documentation
site_description: DbDash Documentation
site_url: https://dralmostright.github.io/dbdash/

repo_url: https://github.com/dralmostright/dbdash
repo_name: GitHub

theme:
  name: material
  logo: assets/logo.png
  favicon: assets/favicon.png  
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.superfences
  - pymdownx.tabbed
  - pymdownx.details
  - pymdownx.highlight

nav:
  - Home: index.md
  - Overview:
      - Architecture: overview/architecture.md
      - Tech Stack: overview/tech-stack.md
  - Frontend:
      - Overview: frontend/overview.md
      - Setup: frontend/setup.md
      - Build & Deploy: frontend/deployment.md
  - Backend:
      - Overview: backend/overview.md
      - Setup: backend/setup.md
      - Environment Variables: backend/env-vars.md
  - API:
      - Introduction: api/introduction.md
      - Authentication: api/authentication.md
      - Endpoints:
          - Users: api/endpoints/users.md
  - Guides:
      - Local Development: guides/local-development.md
      - CI/CD: guides/ci-cd.md
  - Contributing: contributing.md
